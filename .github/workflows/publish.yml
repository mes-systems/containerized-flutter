name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/mes-systems/containerized-flutter

jobs:
  manifest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish_mode: ${{ steps.plan.outputs.publish_mode }}
      publish_matrix: ${{ steps.plan.outputs.publish_matrix }}
      publish_needed: ${{ steps.plan.outputs.publish_needed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate supported version manifest
        run: scripts/validate-supported-versions.sh supported_version.json

      - name: Validate supported base manifest
        run: scripts/validate-supported-bases.sh supported_bases.json

      - name: Run script guardrails
        run: tests/scripts_test.sh

      - name: Plan publication
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            scripts/classify-publication.sh --workflow-dispatch \
              supported_version.json supported_bases.json \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! base_sha="$(jq -er '.before' "$GITHUB_EVENT_PATH")"; then
            printf 'publication planning failed: push event has no valid before SHA\n' >&2
            exit 1
          fi
          if ! head_sha="$(jq -er '.after' "$GITHUB_EVENT_PATH")"; then
            printf 'publication planning failed: push event has no valid after SHA\n' >&2
            exit 1
          fi
          if [[ ! "$base_sha" =~ ^[[:xdigit:]]{40}$ || ! "$head_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
            printf 'publication planning failed: push event contains an invalid revision range\n' >&2
            exit 1
          fi
          git fetch --no-tags origin "$base_sha" "$head_sha" \
            || { printf 'publication planning failed: could not fetch push revisions\n' >&2; exit 1; }
          scripts/classify-publication.sh --revisions \
            "$base_sha" "$head_sha" \
            supported_version.json supported_bases.json >> "$GITHUB_OUTPUT"

  publish:
    name: publish (${{ matrix.version }}, ${{ matrix.base_id }})
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.manifest.outputs.publish_needed == 'true'
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.publish_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Acquire Flutter release
        run: |
          set -euo pipefail
          scripts/acquire-flutter.sh "${{ matrix.version }}" "${{ matrix.channel }}" .artifacts

      - name: Verify Flutter release
        id: verify
        run: |
          set -euo pipefail
          scripts/verify-release.sh \
            "${{ matrix.version }}" \
            "${{ matrix.channel }}" \
            "${{ matrix.revision }}" \
            "${{ matrix.archive_sha256 }}" \
            .artifacts/flutter-sdk.tar.xz

      - name: Derive image metadata
        id: metadata
        run: |
          scripts/image-metadata.sh \
            "${{ matrix.version }}" \
            "${{ github.sha }}" \
            "${{ matrix.base_id }}" \
            supported_bases.json

      - name: Set up Docker with containerd image store
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v29.8.0
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Verify containerd image store
        run: |
          set -euo pipefail
          docker info --format '{{json .DriverStatus}}' \
            | grep -F 'io.containerd.snapshotter.v1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image locally
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: mode=max,version=v1
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.build_tag }}
          cache-from: type=gha,scope=flutter-${{ matrix.version }}-${{ matrix.base_id }}
          cache-to: type=gha,mode=max,scope=flutter-${{ matrix.version }}-${{ matrix.base_id }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_reference }}
            FLUTTER_VERSION=${{ matrix.version }}
            FLUTTER_CHANNEL=${{ matrix.channel }}
            FLUTTER_REVISION=${{ matrix.revision }}
            FLUTTER_ARCHIVE_SHA256=${{ steps.verify.outputs.archive_sha256 }}
            SOURCE_REVISION=${{ github.sha }}

      - name: Verify local build attestations
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail

          build_ref="$(
            jq -er '."buildx.build.ref"' <<< "$BUILD_METADATA"
          )"
          builder="${build_ref%%/*}"
          record="${build_ref##*/}"
          [[ -n "$builder" && -n "$record" && "$builder" != "$build_ref" ]]

          history="$(
            docker buildx \
              --builder "$builder" \
              history inspect "$record" \
              --format json
          )"

          jq -e '
            [.Attachments[].Type] as $types
            | ($types | index("https://slsa.dev/provenance/v1")) != null
            and
            ($types | index("https://spdx.dev/Document")) != null
          ' <<< "$history" >/dev/null

      - name: Smoke test image
        run: |
          set -euo pipefail
          scripts/smoke-test.sh \
            "${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}" \
            "${{ matrix.version }}" \
            "${{ matrix.revision }}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image and capture digest
        id: push
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CANONICAL_TAG: ${{ steps.metadata.outputs.tag }}
          BUILD_TAG: ${{ steps.metadata.outputs.build_tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:$BUILD_TAG"
          registry_digest="$(
            docker buildx imagetools inspect \
              "$IMAGE_NAME:$BUILD_TAG" \
              --format '{{.Manifest.Digest}}'
          )"
          [[ "$registry_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          expected_digest='${{ steps.build.outputs.digest }}'
          [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$registry_digest" == "$expected_digest" ]]

          expected_base_digest="${{ matrix.base_reference }}"
          expected_base_digest="${expected_base_digest##*@}"
          expected_base_digest="${expected_base_digest#sha256:}"
          [[ "$expected_base_digest" =~ ^[0-9a-f]{64}$ ]]

          provenance="$(
            docker buildx imagetools inspect \
              "$IMAGE_NAME:$BUILD_TAG" \
              --format '{{json .Provenance.SLSA}}'
          )"
          jq --arg digest "$expected_base_digest" -e '
            type == "object"
            and (.buildDefinition | type == "object")
            and (.runDetails | type == "object")
            and (
              .buildDefinition.buildType
              == "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md"
            )
            and (
              .buildDefinition.resolvedDependencies
              | type == "array" and length > 0
            )
            and (
              any(
                .buildDefinition.resolvedDependencies[];
                .digest.sha256 == $digest
              )
            )
            and (
              .buildDefinition.internalParameters.buildConfig.llbDefinition
              | type == "array" and length > 0
            )
            and (
              .runDetails.metadata.buildkit_completeness.request == true
            )
          ' <<< "$provenance" >/dev/null

          sbom="$(
            docker buildx imagetools inspect \
              "$IMAGE_NAME:$BUILD_TAG" \
              --format '{{json .SBOM.SPDX}}'
          )"
          jq -e '
            type == "object"
            and .SPDXID == "SPDXRef-DOCUMENT"
            and (.spdxVersion | type == "string")
          ' <<< "$sbom" >/dev/null

          docker push "$IMAGE_NAME:$CANONICAL_TAG"
          canonical_digest="$(
            docker buildx imagetools inspect \
              "$IMAGE_NAME:$CANONICAL_TAG" \
              --format '{{.Manifest.Digest}}'
          )"
          [[ "$canonical_digest" == "$registry_digest" ]]

          printf 'digest=%s\n' "$registry_digest" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
          create-storage-record: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove tested image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          images=(
            "${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}"
            "${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.build_tag }}"
          )
          cleanup_failed=0
          for image in "${images[@]}"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              if ! docker image rm -f "$image"; then
                cleanup_failed=1
              fi
            fi
          done
          for image in "${images[@]}"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              printf 'test image leaked after cleanup: %s\n' "$image" >&2
              cleanup_failed=1
            fi
          done
          if (( cleanup_failed != 0 )); then
            exit 1
          fi
