name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/mes-systems/containerized-flutter

jobs:
  manifest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      publish_matrix: ${{ steps.matrix.outputs.publish_matrix }}
      publish_needed: ${{ steps.matrix.outputs.publish_needed }}
      requires_toolchain_ci: ${{ steps.classify.outputs.requires_toolchain_ci }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate supported version manifest
        run: scripts/validate-supported-versions.sh supported_version.json

      - name: Run script guardrails
        run: tests/scripts_test.sh

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'requires_toolchain_ci=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(jq -er '.before' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          head_sha="$(jq -er '.after' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          if [[ ! "$base_sha" =~ ^[[:xdigit:]]{40}$ || ! "$head_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
            printf 'requires_toolchain_ci=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$base_sha" "$head_sha" >/dev/null 2>&1 || true
          scripts/classify-changes.sh --revisions "$base_sha" "$head_sha" \
            >> "$GITHUB_OUTPUT"

      - name: Build supported version matrices
        id: matrix
        shell: bash
        env:
          REQUIRES_TOOLCHAIN_CI: ${{ steps.classify.outputs.requires_toolchain_ci }}
        run: |
          set -euo pipefail
          matrix="$(jq -c '{include: [.supported_versions[] | {version, channel, revision, archive, archive_sha256}]}' supported_version.json)"
          publish_matrix="$matrix"
          publish_needed=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            publish_needed=true
          elif [[ "$REQUIRES_TOOLCHAIN_CI" == "true" ]]; then
            base_sha="$(jq -er '.before' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
            head_sha="$(jq -er '.after' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
            manifest_only=false
            if [[ "$base_sha" =~ ^[[:xdigit:]]{40}$ && "$head_sha" =~ ^[[:xdigit:]]{40}$ ]] \
              && git rev-parse --verify "${base_sha}^{commit}" >/dev/null 2>&1 \
              && git rev-parse --verify "${head_sha}^{commit}" >/dev/null 2>&1; then
              diff_file="$(mktemp "${TMPDIR:-/tmp}/publish-matrix.XXXXXX")"
              trap 'rm -f -- "$diff_file"' EXIT
              if git diff --name-only --no-renames -z "$base_sha" "$head_sha" -- > "$diff_file"; then
                path_count=0
                has_manifest=false
                manifest_only=true
                while IFS= read -r -d '' path; do
                  path_count=$((path_count + 1))
                  case "$path" in
                    supported_version.json) has_manifest=true ;;
                    README.md) ;;
                    *) manifest_only=false ;;
                  esac
                done < "$diff_file"
                [[ "$has_manifest" == true && "$path_count" -gt 0 ]] || manifest_only=false
              fi

              if [[ "$manifest_only" == true ]]; then
                old_manifest="$(mktemp "${TMPDIR:-/tmp}/publish-old-manifest.XXXXXX")"
                trap 'rm -f -- "$diff_file" "$old_manifest"' EXIT
                if git show "$base_sha:supported_version.json" > "$old_manifest" \
                  && jq -e 'type == "object" and (.supported_versions | type == "array")' \
                    "$old_manifest" >/dev/null; then
                  publish_matrix="$(scripts/publish-matrix.sh "$old_manifest" supported_version.json)"
                  if [[ "$(jq -er '.include | length' <<< "$publish_matrix")" -gt 0 ]]; then
                    publish_needed=true
                  fi
                else
                  publish_needed=true
                fi
              else
                publish_needed=true
              fi
            else
              publish_needed=true
            fi
          fi

          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'publish_matrix=%s\n' "$publish_matrix" >> "$GITHUB_OUTPUT"
          printf 'publish_needed=%s\n' "$publish_needed" >> "$GITHUB_OUTPUT"

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.manifest.outputs.publish_needed == 'true'
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.publish_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Acquire Flutter release
        run: |
          set -euo pipefail
          scripts/acquire-flutter.sh "${{ matrix.version }}" "${{ matrix.channel }}" .artifacts

      - name: Verify Flutter release
        id: verify
        run: |
          set -euo pipefail
          scripts/verify-release.sh \
            "${{ matrix.version }}" \
            "${{ matrix.channel }}" \
            "${{ matrix.revision }}" \
            "${{ matrix.archive_sha256 }}" \
            .artifacts/flutter-sdk.tar.xz

      - name: Derive image metadata
        id: metadata
        run: scripts/image-metadata.sh "${{ matrix.version }}" "${{ github.sha }}" Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.build_tag }}
          cache-from: type=gha,scope=flutter-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=flutter-${{ matrix.version }}
          build-args: |
            FLUTTER_VERSION=${{ matrix.version }}
            FLUTTER_CHANNEL=${{ matrix.channel }}
            FLUTTER_REVISION=${{ matrix.revision }}
            FLUTTER_ARCHIVE_SHA256=${{ steps.verify.outputs.archive_sha256 }}
            SOURCE_REVISION=${{ github.sha }}

      - name: Smoke test image
        run: |
          set -euo pipefail
          scripts/smoke-test.sh \
            "${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}" \
            "${{ matrix.version }}" \
            "${{ matrix.revision }}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image and capture digest
        id: push
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CANONICAL_TAG: ${{ steps.metadata.outputs.tag }}
          BUILD_TAG: ${{ steps.metadata.outputs.build_tag }}
        run: |
          set -euo pipefail
          image_digest() {
            local reference="$1"
            docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$reference" \
              | awk -F@ '$2 ~ /^sha256:[0-9a-f]{64}$/ { print $2; exit }'
          }

          docker push "$IMAGE_NAME:$CANONICAL_TAG"
          digest="$(image_digest "$IMAGE_NAME:$CANONICAL_TAG")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker push "$IMAGE_NAME:$BUILD_TAG"
          build_digest="$(image_digest "$IMAGE_NAME:$BUILD_TAG")"
          [[ "$build_digest" == "$digest" ]]

          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
