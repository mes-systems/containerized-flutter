name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/mes-systems/containerized-flutter

jobs:
  manifest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish_mode: ${{ steps.plan.outputs.publish_mode }}
      publish_matrix: ${{ steps.plan.outputs.publish_matrix }}
      publish_needed: ${{ steps.plan.outputs.publish_needed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate supported version manifest
        run: scripts/validate-supported-versions.sh supported_version.json

      - name: Run script guardrails
        run: tests/scripts_test.sh

      - name: Plan publication
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            scripts/classify-publication.sh --workflow-dispatch supported_version.json \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! base_sha="$(jq -er '.before' "$GITHUB_EVENT_PATH")"; then
            printf 'publication planning failed: push event has no valid before SHA\n' >&2
            exit 1
          fi
          if ! head_sha="$(jq -er '.after' "$GITHUB_EVENT_PATH")"; then
            printf 'publication planning failed: push event has no valid after SHA\n' >&2
            exit 1
          fi
          if [[ ! "$base_sha" =~ ^[[:xdigit:]]{40}$ || ! "$head_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
            printf 'publication planning failed: push event contains an invalid revision range\n' >&2
            exit 1
          fi
          git fetch --no-tags origin "$base_sha" "$head_sha" \
            || { printf 'publication planning failed: could not fetch push revisions\n' >&2; exit 1; }
          scripts/classify-publication.sh --revisions \
            "$base_sha" "$head_sha" supported_version.json >> "$GITHUB_OUTPUT"

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.manifest.outputs.publish_needed == 'true'
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.publish_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Acquire Flutter release
        run: |
          set -euo pipefail
          scripts/acquire-flutter.sh "${{ matrix.version }}" "${{ matrix.channel }}" .artifacts

      - name: Verify Flutter release
        id: verify
        run: |
          set -euo pipefail
          scripts/verify-release.sh \
            "${{ matrix.version }}" \
            "${{ matrix.channel }}" \
            "${{ matrix.revision }}" \
            "${{ matrix.archive_sha256 }}" \
            .artifacts/flutter-sdk.tar.xz

      - name: Derive image metadata
        id: metadata
        run: scripts/image-metadata.sh "${{ matrix.version }}" "${{ github.sha }}" Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.build_tag }}
          cache-from: type=gha,scope=flutter-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=flutter-${{ matrix.version }}
          build-args: |
            FLUTTER_VERSION=${{ matrix.version }}
            FLUTTER_CHANNEL=${{ matrix.channel }}
            FLUTTER_REVISION=${{ matrix.revision }}
            FLUTTER_ARCHIVE_SHA256=${{ steps.verify.outputs.archive_sha256 }}
            SOURCE_REVISION=${{ github.sha }}

      - name: Smoke test image
        run: |
          set -euo pipefail
          scripts/smoke-test.sh \
            "${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}" \
            "${{ matrix.version }}" \
            "${{ matrix.revision }}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image and capture digest
        id: push
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CANONICAL_TAG: ${{ steps.metadata.outputs.tag }}
          BUILD_TAG: ${{ steps.metadata.outputs.build_tag }}
        run: |
          set -euo pipefail
          image_digest() {
            local reference="$1"
            docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$reference" \
              | awk -F@ '$2 ~ /^sha256:[0-9a-f]{64}$/ { print $2; exit }'
          }

          docker push "$IMAGE_NAME:$CANONICAL_TAG"
          digest="$(image_digest "$IMAGE_NAME:$CANONICAL_TAG")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker push "$IMAGE_NAME:$BUILD_TAG"
          build_digest="$(image_digest "$IMAGE_NAME:$BUILD_TAG")"
          [[ "$build_digest" == "$digest" ]]

          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
