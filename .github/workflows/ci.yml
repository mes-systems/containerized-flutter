name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ci_mode: ${{ steps.matrix.outputs.ci_mode }}
      build_needed: ${{ steps.matrix.outputs.build_needed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate supported version manifest
        run: scripts/validate-supported-versions.sh supported_version.json

      - name: Validate supported base manifest
        run: scripts/validate-supported-bases.sh supported_bases.json

      - name: Run script guardrails
        run: tests/scripts_test.sh

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'ci_mode=full\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          head_sha="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          if [[ ! "$base_sha" =~ ^[[:xdigit:]]{40}$ || ! "$head_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
            printf 'ci_mode=full\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --no-tags origin "$base_sha" "$head_sha"; then
            printf 'ci_mode=full\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          scripts/classify-changes.sh --revisions "$base_sha" "$head_sha" \
            >> "$GITHUB_OUTPUT"

      - name: Build supported version matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          ci_mode="${{ steps.classify.outputs.ci_mode }}"
          matrix='{"include":[]}'
          build_needed=false

          case "$ci_mode" in
            none)
              ;;
            full)
              matrix="$(scripts/build-matrix.sh supported_version.json supported_bases.json)"
              build_needed=true
              ;;
            selective)
              temp_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ci-manifests.XXXXXX")"
              trap 'rm -rf -- "$temp_dir"' EXIT
              old_versions="$temp_dir/supported_version.json"
              old_bases="$temp_dir/supported_bases.json"
              new_versions="$temp_dir/tested-supported_version.json"
              new_bases="$temp_dir/tested-supported_bases.json"
              base_sha="${{ steps.classify.outputs.base_sha }}"

              if ! git show "$base_sha:supported_version.json" > "$old_versions" \
                || ! git show "$base_sha:supported_bases.json" > "$old_bases" \
                || ! cp supported_version.json "$new_versions" \
                || ! cp supported_bases.json "$new_bases"; then
                printf 'could not read PR manifests; falling back to full CI\n' >&2
                ci_mode=full
              elif ! scripts/validate-supported-versions.sh "$old_versions" \
                || ! scripts/validate-supported-bases.sh --allow-multiple "$old_bases" \
                || ! scripts/validate-supported-versions.sh "$new_versions" \
                || ! scripts/validate-supported-bases.sh "$new_bases"; then
                printf 'could not validate PR manifests; falling back to full CI\n' >&2
                ci_mode=full
              else
                if ! matrix="$(scripts/publish-matrix.sh \
                  "$old_versions" "$new_versions" \
                  "$old_bases" "$new_bases")"; then
                  printf 'could not plan selective CI; falling back to full CI\n' >&2
                  ci_mode=full
                elif ! jq -e '.include | type == "array"' <<< "$matrix" >/dev/null; then
                  printf 'selective CI planner returned a malformed matrix; falling back to full CI\n' >&2
                  ci_mode=full
                elif ! jq -e \
                  --slurpfile versions "$new_versions" \
                  --slurpfile bases "$new_bases" '
                    (.include | type == "array")
                    and all(
                      .include[];
                      . as $row
                      | any(
                          $versions[0].supported_versions[];
                          .version == $row.version
                          and .channel == $row.channel
                          and .revision == $row.revision
                          and .archive == $row.archive
                          and .archive_sha256 == $row.archive_sha256
                        )
                      and any(
                          $bases[0].bases[];
                          .id == $row.base_id
                          and .family == $row.base_family
                          and .version == $row.base_version
                          and .variant == $row.base_variant
                          and .reference == $row.base_reference
                        )
                    )
                  ' <<< "$matrix" >/dev/null; then
                  printf 'selective CI matrix is inconsistent with the tested manifests; falling back to full CI\n' >&2
                  ci_mode=full
                elif [[ "$(jq -r '.include | length' <<< "$matrix")" == 0 ]]; then
                  printf 'selective CI planner returned an unexpected empty matrix\n' >&2
                  exit 1
                else
                  build_needed=true
                fi
              fi

              if [[ "$ci_mode" == full ]]; then
                matrix="$(scripts/build-matrix.sh supported_version.json supported_bases.json)"
                build_needed=true
              fi
              ;;
            *)
              printf 'invalid CI mode from classifier: %s\n' "$ci_mode" >&2
              exit 1
              ;;
          esac

          jq -e '.include | type == "array"' <<< "$matrix" >/dev/null
          printf 'ci_mode=%s\n' "$ci_mode" >> "$GITHUB_OUTPUT"
          printf 'build_needed=%s\n' "$build_needed" >> "$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.version }}, ${{ matrix.base_id }})
    needs: manifest
    if: needs.manifest.outputs.ci_mode != 'none'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Acquire Flutter release
        run: |
          set -euo pipefail
          scripts/acquire-flutter.sh "${{ matrix.version }}" "${{ matrix.channel }}" .artifacts

      - name: Verify Flutter release
        id: verify
        run: |
          set -euo pipefail
          scripts/verify-release.sh \
            "${{ matrix.version }}" \
            "${{ matrix.channel }}" \
            "${{ matrix.revision }}" \
            "${{ matrix.archive_sha256 }}" \
            .artifacts/flutter-sdk.tar.xz

      - name: Derive image metadata
        id: metadata
        run: |
          scripts/image-metadata.sh \
            "${{ matrix.version }}" \
            "${{ github.sha }}" \
            "${{ matrix.base_id }}" \
            supported_bases.json

      - name: Set up Docker with containerd image store
        id: docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v29.8.0
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Verify containerd image store
        run: |
          set -euo pipefail
          docker info --format '{{json .DriverStatus}}' \
            | grep -F 'io.containerd.snapshotter.v1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: mode=max,version=v1
          sbom: true
          tags: ghcr.io/mes-systems/containerized-flutter:${{ steps.metadata.outputs.tag }}
          cache-from: type=gha,scope=flutter-${{ matrix.version }}-${{ matrix.base_id }}
          cache-to: type=gha,mode=max,scope=flutter-${{ matrix.version }}-${{ matrix.base_id }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_reference }}
            FLUTTER_VERSION=${{ matrix.version }}
            FLUTTER_CHANNEL=${{ matrix.channel }}
            FLUTTER_REVISION=${{ matrix.revision }}
            FLUTTER_ARCHIVE_SHA256=${{ steps.verify.outputs.archive_sha256 }}
            SOURCE_REVISION=${{ github.sha }}

      - name: Verify local build attestations
        env:
          DOCKER_SOCKET: ${{ steps.docker.outputs.sock }}
        run: |
          set -euo pipefail

          docker_socket_uri="${DOCKER_SOCKET:?docker/setup-docker-action did not return a socket}"
          case "$docker_socket_uri" in
            unix://*)
              docker_socket="${docker_socket_uri#unix://}"
              ;;
            *)
              printf 'unexpected Docker socket URI: %s\n' "$docker_socket_uri" >&2
              exit 1
              ;;
          esac

          if [[ ! -S "$docker_socket" ]]; then
            printf 'Docker socket does not exist or is not a Unix socket: %s\n' \
              "$docker_socket" >&2
            exit 1
          fi

          image="ghcr.io/mes-systems/containerized-flutter:${{ steps.metadata.outputs.tag }}"
          expected_base_digest="${{ matrix.base_reference }}"
          expected_base_digest="${expected_base_digest##*@}"
          expected_base_digest="${expected_base_digest#sha256:}"
          expected_base_digest="$(
            printf '%s' "$expected_base_digest" | tr '[:upper:]' '[:lower:]'
          )"
          [[ "$expected_base_digest" =~ ^[0-9a-f]{64}$ ]]

          attestations="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --unix-socket "$docker_socket" \
              --get \
              --data-urlencode 'platform={"os":"linux","architecture":"amd64"}' \
              --data-urlencode 'statement=1' \
              "http://localhost/v1.55/images/${image}/attestations"
          )"

          jq --arg digest "$expected_base_digest" -e '
            type == "array"
            and
            any(.[];
              .PredicateType == "https://slsa.dev/provenance/v1"
              and (.Statement | type == "object")
              and .Statement.predicateType == "https://slsa.dev/provenance/v1"
              and (.Statement.predicate.buildDefinition | type == "object")
              and (.Statement.predicate.runDetails | type == "object")
              and (
                .Statement.predicate.buildDefinition.buildType
                == "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md"
              )
              and (
                .Statement.predicate.buildDefinition.resolvedDependencies
                | type == "array" and length > 0
              )
              and any(
                .Statement.predicate.buildDefinition.resolvedDependencies[]?;
                .digest.sha256 == $digest
              )
              and (
                .Statement.predicate.buildDefinition.internalParameters.buildConfig.llbDefinition
                | type == "array" and length > 0
              )
              and (
                .Statement.predicate.runDetails.metadata.buildkit_completeness.request
                == true
              )
            )
            and
            any(.[];
              .PredicateType == "https://spdx.dev/Document"
              and (.Statement | type == "object")
              and .Statement.predicateType == "https://spdx.dev/Document"
              and .Statement.predicate.SPDXID == "SPDXRef-DOCUMENT"
              and (.Statement.predicate.spdxVersion | type == "string")
            )
          ' <<< "$attestations" >/dev/null

      - name: Smoke test image
        run: |
          set -euo pipefail
          scripts/smoke-test.sh \
            ghcr.io/mes-systems/containerized-flutter:${{ steps.metadata.outputs.tag }} \
            "${{ matrix.version }}" \
            "${{ matrix.revision }}"

      - name: Remove tested image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/mes-systems/containerized-flutter:${{ steps.metadata.outputs.tag }}"
          if docker image inspect "$image" >/dev/null 2>&1; then
            docker image rm -f "$image"
          fi
          if docker image inspect "$image" >/dev/null 2>&1; then
            printf 'test image leaked after cleanup: %s\n' "$image" >&2
            exit 1
          fi

  ci-gate:
    name: CI gate
    if: always()
    needs: [manifest, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate CI results
        env:
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CI_MODE: ${{ needs.manifest.outputs.ci_mode }}
          BUILD_NEEDED: ${{ needs.manifest.outputs.build_needed }}
          MATRIX: ${{ needs.manifest.outputs.matrix }}
        run: |
          set -euo pipefail

          [[ "$MANIFEST_RESULT" == "success" ]] || {
            printf 'manifest result was %s\n' "$MANIFEST_RESULT" >&2
            exit 1
          }

          [[ "$BUILD_NEEDED" == true || "$BUILD_NEEDED" == false ]] || {
            printf 'invalid build-needed output: %s\n' "$BUILD_NEEDED" >&2
            exit 1
          }
          jq -e '.include | type == "array"' <<< "$MATRIX" >/dev/null || {
            printf 'missing or malformed build matrix\n' >&2
            exit 1
          }
          matrix_count="$(jq -r '.include | length' <<< "$MATRIX")"

          case "$CI_MODE" in
            full)
              [[ "$BUILD_NEEDED" == true && "$matrix_count" -gt 0 ]] || {
                printf 'full CI had no build matrix\n' >&2
                exit 1
              }
              [[ "$BUILD_RESULT" == "success" ]] || {
                printf 'full CI result was %s\n' "$BUILD_RESULT" >&2
                exit 1
              }
              ;;
            selective)
              [[ "$BUILD_NEEDED" == true && "$matrix_count" -gt 0 ]] || {
                printf 'selective CI had no build matrix\n' >&2
                exit 1
              }
              [[ "$BUILD_RESULT" == "success" ]] || {
                printf 'selective CI result was %s\n' "$BUILD_RESULT" >&2
                exit 1
              }
              ;;
            none)
              [[ "$BUILD_NEEDED" == false && "$matrix_count" == 0 ]] || {
                printf 'none CI had an unexpected build matrix\n' >&2
                exit 1
              }
              [[ "$BUILD_RESULT" == "skipped" ]] || {
                printf 'none CI result was %s\n' "$BUILD_RESULT" >&2
                exit 1
              }
              ;;
            *)
              printf 'invalid CI mode: %s\n' "$CI_MODE" >&2
              exit 1
              ;;
          esac
