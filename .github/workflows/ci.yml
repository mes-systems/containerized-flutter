name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      requires_toolchain_ci: ${{ steps.classify.outputs.requires_toolchain_ci }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate supported version manifest
        run: scripts/validate-supported-versions.sh supported_version.json

      - name: Validate supported base manifest
        run: scripts/validate-supported-bases.sh supported_bases.json

      - name: Run script guardrails
        run: tests/scripts_test.sh

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'requires_toolchain_ci=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          head_sha="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          if [[ ! "$base_sha" =~ ^[[:xdigit:]]{40}$ || ! "$head_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
            printf 'requires_toolchain_ci=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$base_sha" "$head_sha" >/dev/null 2>&1 || true
          scripts/classify-changes.sh --revisions "$base_sha" "$head_sha" \
            >> "$GITHUB_OUTPUT"

      - name: Build supported version matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(scripts/build-matrix.sh supported_version.json supported_bases.json)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.version }}, ${{ matrix.base_id }})
    needs: manifest
    if: needs.manifest.outputs.requires_toolchain_ci == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Acquire Flutter release
        run: |
          set -euo pipefail
          scripts/acquire-flutter.sh "${{ matrix.version }}" "${{ matrix.channel }}" .artifacts

      - name: Verify Flutter release
        id: verify
        run: |
          set -euo pipefail
          scripts/verify-release.sh \
            "${{ matrix.version }}" \
            "${{ matrix.channel }}" \
            "${{ matrix.revision }}" \
            "${{ matrix.archive_sha256 }}" \
            .artifacts/flutter-sdk.tar.xz

      - name: Derive image metadata
        id: metadata
        run: |
          scripts/image-metadata.sh \
            "${{ matrix.version }}" \
            "${{ github.sha }}" \
            "${{ matrix.base_id }}" \
            supported_bases.json

      - name: Set up Docker with containerd image store
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v29.8.0
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Verify containerd image store
        run: |
          set -euo pipefail
          docker info --format '{{json .DriverStatus}}' \
            | grep -F 'io.containerd.snapshotter.v1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: mode=max,version=v1
          sbom: true
          tags: ghcr.io/mes-systems/containerized-flutter:${{ steps.metadata.outputs.tag }}
          cache-from: type=gha,scope=flutter-${{ matrix.version }}-${{ matrix.base_id }}
          cache-to: type=gha,mode=max,scope=flutter-${{ matrix.version }}-${{ matrix.base_id }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_reference }}
            FLUTTER_VERSION=${{ matrix.version }}
            FLUTTER_CHANNEL=${{ matrix.channel }}
            FLUTTER_REVISION=${{ matrix.revision }}
            FLUTTER_ARCHIVE_SHA256=${{ steps.verify.outputs.archive_sha256 }}
            SOURCE_REVISION=${{ github.sha }}

      - name: Verify local build attestations
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail

          build_ref="$(
            jq -er '."buildx.build.ref"' <<< "$BUILD_METADATA"
          )"

          history="$(
            docker buildx history inspect "$build_ref" --format json
          )"

          jq -e '
            [.Attachments[].Type] as $types
            | ($types | index("https://slsa.dev/provenance/v1")) != null
            and
            ($types | index("https://spdx.dev/Document")) != null
          ' <<< "$history" >/dev/null

      - name: Smoke test image
        run: |
          set -euo pipefail
          scripts/smoke-test.sh \
            ghcr.io/mes-systems/containerized-flutter:${{ steps.metadata.outputs.tag }} \
            "${{ matrix.version }}" \
            "${{ matrix.revision }}"

      - name: Remove tested image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/mes-systems/containerized-flutter:${{ steps.metadata.outputs.tag }}"
          if docker image inspect "$image" >/dev/null 2>&1; then
            docker image rm -f "$image"
          fi
          if docker image inspect "$image" >/dev/null 2>&1; then
            printf 'test image leaked after cleanup: %s\n' "$image" >&2
            exit 1
          fi

  ci-gate:
    name: CI gate
    if: always()
    needs: [manifest, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate CI results
        env:
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          REQUIRES_TOOLCHAIN_CI: ${{ needs.manifest.outputs.requires_toolchain_ci }}
        run: |
          set -euo pipefail

          [[ "$MANIFEST_RESULT" == "success" ]] || {
            printf 'manifest result was %s\n' "$MANIFEST_RESULT" >&2
            exit 1
          }

          case "$REQUIRES_TOOLCHAIN_CI" in
            true)
              [[ "$BUILD_RESULT" == "success" ]] || {
                printf 'required toolchain CI result was %s\n' "$BUILD_RESULT" >&2
                exit 1
              }
              ;;
            false)
              [[ "$BUILD_RESULT" == "skipped" ]] || {
                printf 'unexpected skipped-matrix result: %s\n' "$BUILD_RESULT" >&2
                exit 1
              }
              ;;
            *)
              printf 'invalid toolchain CI classification: %s\n' "$REQUIRES_TOOLCHAIN_CI" >&2
              exit 1
              ;;
          esac
