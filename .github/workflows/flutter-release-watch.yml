name: Flutter release watcher

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: flutter-release-watcher
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_MANIFEST_URL: https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
  WATCHER_BRANCH: automation/flutter-support-update
  PR_TITLE: "chore: refresh supported Flutter releases"
  ANOMALY_TITLE: "security: Flutter release metadata anomaly detected"

jobs:
  watch:
    runs-on: ubuntu-24.04
    environment:
      name: flutter-release-watcher
      deployment: false
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download official Flutter release manifest
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --output releases_linux.json \
            "$RELEASE_MANIFEST_URL"

      - name: Validate release manifest structure
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'type == "object" and (.releases | type == "array")' \
            releases_linux.json >/dev/null

      - name: Mint short-lived watcher GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FLUTTER_WATCHER_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_WATCHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: containerized-flutter
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-metadata: read

      - name: Configure GitHub App credentials
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Base watcher branch on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git fetch --no-tags origin \
            "refs/heads/$WATCHER_BRANCH:refs/remotes/origin/$WATCHER_BRANCH" \
            || true
          git checkout -B "$WATCHER_BRANCH" origin/main

      - name: Calculate supported Flutter release update
        id: update
        shell: bash
        env:
          SUMMARY_JSON: ${{ runner.temp }}/flutter-release-summary.json
          SUMMARY_MARKDOWN: ${{ runner.temp }}/flutter-release-summary.md
        run: |
          set +e
          python3 scripts/update-supported-versions.py \
            --write \
            --manifest supported_version.json \
            --releases releases_linux.json \
            --readme README.md \
            --summary-json "$SUMMARY_JSON" \
            --summary-markdown "$SUMMARY_MARKDOWN"
          updater_status=$?
          status=error
          update_needed=false
          if [[ -s "$SUMMARY_JSON" ]]; then
            status="$(jq -er '.status' "$SUMMARY_JSON" 2>/dev/null || true)"
            update_needed="$(jq -er '.update_needed' "$SUMMARY_JSON" 2>/dev/null || true)"
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'update_needed=%s\n' "$update_needed" >> "$GITHUB_OUTPUT"
          exit "$updater_status"

      - name: Add watcher result to job summary
        if: always()
        env:
          SUMMARY_MARKDOWN: ${{ runner.temp }}/flutter-release-summary.md
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$SUMMARY_MARKDOWN" ]]; then
            cat "$SUMMARY_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Flutter release watcher did not produce a summary.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run repository guardrails and tests
        id: guardrails
        if: steps.update.outputs.status == 'update'
        shell: bash
        run: |
          set -euo pipefail
          scripts/validate-supported-versions.sh supported_version.json
          tests/scripts_test.sh
          git diff --check

      - name: Create and verify GitHub-signed watcher commit
        if: steps.update.outputs.status == 'update' && steps.guardrails.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          [[ "$main_sha" =~ ^[[:xdigit:]]{40}$ ]] || {
            printf 'invalid fetched main SHA: %s\n' "$main_sha" >&2
            exit 1
          }

          expected_remote=""
          if git show-ref --verify --quiet "refs/remotes/origin/$WATCHER_BRANCH"; then
            expected_remote="$(git rev-parse --verify "refs/remotes/origin/$WATCHER_BRANCH^{commit}")"
            [[ "$expected_remote" =~ ^[[:xdigit:]]{40}$ ]] || {
              printf 'invalid existing watcher branch SHA: %s\n' "$expected_remote" >&2
              exit 1
            }
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/$WATCHER_BRANCH" \
            && git diff --quiet "refs/remotes/origin/$WATCHER_BRANCH" --; then
            existing_details="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$expected_remote")"
            if jq -e '.commit.verification.verified == true' \
              <<< "$existing_details" >/dev/null; then
              printf 'watcher branch already matches current main and generated files\n'
              exit 0
            fi
            printf 'watcher branch tree matches but its head is not verified; recreating it\n'
          fi

          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || {
            printf 'invalid workflow run identity for temporary ref\n' >&2
            exit 1
          }
          temp_branch="automation/tmp/flutter-support-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          temp_created=false
          cleanup_temp_ref() {
            if [[ "$temp_created" == true ]]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/heads/$temp_branch" \
                >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_temp_ref EXIT

          jq -cn --arg ref "refs/heads/$temp_branch" --arg sha "$main_sha" \
            '{ref: $ref, sha: $sha}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input - \
            >/dev/null
          temp_created=true

          version_contents="$(base64 < supported_version.json | tr -d '\n')"
          readme_contents="$(base64 < README.md | tr -d '\n')"
          [[ -n "$version_contents" && -n "$readme_contents" ]] || {
            printf 'generated watcher files could not be encoded\n' >&2
            exit 1
          }

          commit_response="$(
            jq -cn \
              --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg ref "refs/heads/$temp_branch" \
              --arg expected_head "$main_sha" \
              --arg headline "$PR_TITLE" \
              --arg version_contents "$version_contents" \
              --arg readme_contents "$readme_contents" \
              '{
                query: $query,
                variables: {input: {
                  branch: {
                    repositoryNameWithOwner: $repository,
                    refName: $ref
                  },
                  message: {headline: $headline},
                  expectedHeadOid: $expected_head,
                  fileChanges: {additions: [
                    {path: "supported_version.json", contents: $version_contents},
                    {path: "README.md", contents: $readme_contents}
                  ]}
                }}
              }' \
              | gh api graphql --input -
          )"
          jq -e '(.errors // []) | length == 0' <<< "$commit_response" >/dev/null || {
            printf 'GitHub did not create the watcher commit\n' >&2
            exit 1
          }
          commit_oid="$(jq -er '.data.createCommitOnBranch.commit.oid // empty' <<< "$commit_response")" || {
            printf 'GitHub returned no watcher commit SHA\n' >&2
            exit 1
          }
          [[ "$commit_oid" =~ ^[[:xdigit:]]{40}$ ]] || {
            printf 'GitHub returned a malformed watcher commit SHA\n' >&2
            exit 1
          }
          commit_oid="${commit_oid,,}"

          commit_details="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit_oid")"
          jq -e --arg oid "$commit_oid" --arg parent "$main_sha" '
            .sha == $oid
            and (.commit.verification | type == "object")
            and .commit.verification.verified == true
            and (.parents | type == "array" and length == 1)
            and .parents[0].sha == $parent
          ' <<< "$commit_details" >/dev/null || {
            printf 'GitHub watcher commit was not verified; refusing branch update\n' >&2
            exit 1
          }

          if [[ -n "$expected_remote" ]]; then
            current_remote="$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/$WATCHER_BRANCH" \
              --jq '.object.sha')"
            [[ "$current_remote" == "$expected_remote" ]] || {
              printf 'watcher branch changed while preparing the commit\n' >&2
              exit 1
            }
          fi
          repository_node_id="$(gh api \
            "repos/$GITHUB_REPOSITORY" \
            --jq '.node_id')"
          [[ -n "$repository_node_id" ]] || {
            printf 'GitHub returned no repository node ID\n' >&2
            exit 1
          }
          before_oid="$expected_remote"
          [[ -n "$before_oid" ]] || \
            before_oid=0000000000000000000000000000000000000000
          ref_update_response="$(
            jq -cn \
              --arg query 'mutation($input: UpdateRefsInput!) { updateRefs(input: $input) { clientMutationId } }' \
              --arg repository_id "$repository_node_id" \
              --arg ref "refs/heads/$WATCHER_BRANCH" \
              --arg before_oid "$before_oid" \
              --arg after_oid "$commit_oid" \
              '{
                query: $query,
                variables: {input: {
                  repositoryId: $repository_id,
                  refUpdates: [{
                    name: $ref,
                    beforeOid: $before_oid,
                    afterOid: $after_oid,
                    force: true
                  }]
                }}
              }' \
              | gh api graphql --input -
          )"
          jq -e '(.errors // []) | length == 0' <<< "$ref_update_response" >/dev/null || {
            printf 'GitHub rejected the guarded watcher branch update\n' >&2
            exit 1
          }

          canonical_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$WATCHER_BRANCH" \
            --jq '.object.sha')"
          [[ "$canonical_sha" == "$commit_oid" ]] || {
            printf 'watcher branch did not move to the verified commit\n' >&2
            exit 1
          }

      - name: Create or update watcher pull request
        if: steps.update.outputs.status == 'update' && steps.guardrails.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUMMARY_MARKDOWN: ${{ runner.temp }}/flutter-release-summary.md
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list \
            --state open \
            --base main \
            --head "$WATCHER_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body-file "$SUMMARY_MARKDOWN"
          else
            gh pr create \
              --base main \
              --head "$WATCHER_BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$SUMMARY_MARKDOWN"
          fi

      - name: Create or update deduplicated anomaly issue
        if: always() && steps.update.outputs.status == 'security_anomaly'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUMMARY_MARKDOWN: ${{ runner.temp }}/flutter-release-summary.md
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list \
            --state open \
            --limit 100 \
            --json number,title \
            | jq -r --arg title "$ANOMALY_TITLE" \
              '[.[] | select(.title == $title)][0].number // empty')"
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --title "$ANOMALY_TITLE" --body-file "$SUMMARY_MARKDOWN"
          else
            gh issue create --title "$ANOMALY_TITLE" --body-file "$SUMMARY_MARKDOWN"
          fi
