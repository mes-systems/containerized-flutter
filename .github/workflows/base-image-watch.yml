name: Base image watcher

on:
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

concurrency:
  group: base-image-watcher
  cancel-in-progress: false

permissions:
  contents: read

env:
  WATCHER_BRANCH: automation/base-image-update
  PR_TITLE: "chore: refresh supported base image digests"
  ANOMALY_TITLE: "security: base image manifest anomaly detected"

jobs:
  watch:
    runs-on: ubuntu-24.04
    environment:
      name: flutter-release-watcher
      deployment: false
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate supported base manifest
        shell: bash
        run: scripts/validate-supported-bases.sh supported_bases.json

      - name: Mint short-lived watcher GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FLUTTER_WATCHER_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_WATCHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: containerized-flutter
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-metadata: read

      - name: Configure GitHub App credentials
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Base watcher branch on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git fetch --no-tags origin \
            "refs/heads/$WATCHER_BRANCH:refs/remotes/origin/$WATCHER_BRANCH" \
            || true
          git checkout -B "$WATCHER_BRANCH" origin/main

      - name: Resolve GitHub App bot identity
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
            printf 'unexpected GitHub App slug: %s\n' "$APP_SLUG" >&2
            exit 1
          }
          bot_user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          [[ "$bot_user_id" =~ ^[0-9]+$ ]] || {
            printf 'unexpected GitHub App bot user ID: %s\n' "$bot_user_id" >&2
            exit 1
          }
          printf 'user-id=%s\n' "$bot_user_id" >> "$GITHUB_OUTPUT"

      - name: Calculate supported base image update
        id: update
        shell: bash
        env:
          SUMMARY_JSON: ${{ runner.temp }}/base-image-summary.json
          SUMMARY_MARKDOWN: ${{ runner.temp }}/base-image-summary.md
        run: |
          set +e
          python3 scripts/update-supported-bases.py \
            --manifest supported_bases.json \
            --readme README.md \
            --summary-json "$SUMMARY_JSON" \
            --summary-markdown "$SUMMARY_MARKDOWN" \
            --write
          updater_status=$?
          status=error
          update_needed=false
          if [[ -s "$SUMMARY_JSON" ]]; then
            parsed_status="$(jq -er '.status' "$SUMMARY_JSON" 2>/dev/null || true)"
            parsed_update_needed="$(jq -er '.update_needed' "$SUMMARY_JSON" 2>/dev/null || true)"
            [[ -n "$parsed_status" ]] && status="$parsed_status"
            [[ -n "$parsed_update_needed" ]] && update_needed="$parsed_update_needed"
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'update_needed=%s\n' "$update_needed" >> "$GITHUB_OUTPUT"
          exit "$updater_status"

      - name: Add watcher result to job summary
        if: always()
        env:
          SUMMARY_MARKDOWN: ${{ runner.temp }}/base-image-summary.md
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$SUMMARY_MARKDOWN" ]]; then
            cat "$SUMMARY_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Base image watcher did not produce a summary.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reconcile obsolete watcher pull request
        if: >-
          always() &&
          (steps.update.outputs.status == 'unchanged' ||
          steps.update.outputs.status == 'security_anomaly')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list \
            --state open \
            --base main \
            --head "$WATCHER_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            exit 0
          fi
          if [[ "${{ steps.update.outputs.status }}" == "security_anomaly" ]]; then
            comment='Base image watcher closed this PR because it detected a manifest integrity anomaly. The proposed digest is no longer considered safe; see the watcher summary and anomaly issue.'
          else
            comment='Base image watcher closed this PR because the upstream tag now matches the digest on main. The proposed update is obsolete.'
          fi
          gh pr comment "$pr_number" --body "$comment"
          gh pr close "$pr_number"

      - name: Run base updater unit tests
        if: steps.update.outputs.status == 'update'
        shell: bash
        run: python3 -m unittest tests/test_update_supported_bases.py

      - name: Run repository guardrails before commit
        id: guardrails
        if: steps.update.outputs.status == 'update'
        shell: bash
        run: |
          set -euo pipefail
          scripts/validate-supported-bases.sh supported_bases.json
          tests/scripts_test.sh
          git diff --check

      - name: Commit and push watcher branch
        if: steps.update.outputs.status == 'update' && steps.guardrails.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-user.outputs.user-id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/remotes/origin/$WATCHER_BRANCH" \
            && git diff --quiet "refs/remotes/origin/$WATCHER_BRANCH" --; then
            printf 'watcher branch already matches current main and generated files\n'
            exit 0
          fi
          git add supported_bases.json README.md
          git diff --cached --check
          git commit -m "$PR_TITLE"

          expected_remote=""
          if git show-ref --verify --quiet "refs/remotes/origin/$WATCHER_BRANCH"; then
            expected_remote="$(git rev-parse "refs/remotes/origin/$WATCHER_BRANCH")"
          fi
          git push \
            --force-with-lease="refs/heads/$WATCHER_BRANCH:$expected_remote" \
            origin "HEAD:refs/heads/$WATCHER_BRANCH"

      - name: Create or update watcher pull request
        if: steps.update.outputs.status == 'update' && steps.guardrails.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUMMARY_MARKDOWN: ${{ runner.temp }}/base-image-summary.md
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list \
            --state open \
            --base main \
            --head "$WATCHER_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body-file "$SUMMARY_MARKDOWN"
          else
            gh pr create \
              --base main \
              --head "$WATCHER_BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$SUMMARY_MARKDOWN"
          fi

      - name: Create or update deduplicated anomaly issue
        if: always() && steps.update.outputs.status == 'security_anomaly'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUMMARY_MARKDOWN: ${{ runner.temp }}/base-image-summary.md
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list \
            --state open \
            --limit 100 \
            --json number,title \
            | jq -r --arg title "$ANOMALY_TITLE" \
              '[.[] | select(.title == $title)][0].number // empty')"
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --title "$ANOMALY_TITLE" --body-file "$SUMMARY_MARKDOWN"
          else
            gh issue create --title "$ANOMALY_TITLE" --body-file "$SUMMARY_MARKDOWN"
          fi
